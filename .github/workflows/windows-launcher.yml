name: Windows 11 Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-launcher.yml"
      - "installer/**"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "overrides/**"
      - "assets/**"
      - "legal/**"
      - "LICENSE.md"
      - "donut"
  pull_request:
    paths:
      - ".github/workflows/windows-launcher.yml"
      - "installer/**"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "overrides/**"
      - "assets/**"
      - "legal/**"
      - "LICENSE.md"
      - "donut"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 11 x64 Launcher
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check Out UVSR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set Up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400

      - name: Build and Test Launcher
        shell: pwsh
        run: ./installer/build.ps1

      - name: Upload Launcher Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UVSR-Launcher-Windows-11-x64
          path: |
            installer/artifacts/UVSR-Launcher-Windows-11-x64.exe
            installer/artifacts/UVSR-Launcher-Windows-11-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

name: Windows Launcher

on:
  push:
    paths:
      - "launcher/**"
      - "LICENSE.md"
      - "cmake/**"
      - "src/**"
      - "tools/strict_json_contract.h"
      - "assets/fonts/noto-sans/**"
      - ".github/workflows/windows-launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
      - "LICENSE.md"
      - "cmake/**"
      - "src/**"
      - "tools/strict_json_contract.h"
      - "assets/fonts/noto-sans/**"
      - ".github/workflows/windows-launcher.yml"
  workflow_dispatch:
    inputs:
      require-publication-signature:
        description: Fail unless the built launcher has a valid Authenticode signature
        required: true
        type: boolean
        default: false
      export-launcher-artifact:
        description: Retain the verified launcher and build record for download
        required: true
        type: boolean
        default: false
      verify-release-artifacts:
        description: Check the signed feeds against their exact release assets and installation contracts
        required: true
        type: boolean
        default: false
      stage-renderer-artifact:
        description: Copy the exact hosted renderer ZIP to its existing draft release
        required: true
        type: boolean
        default: false
      renderer-artifact-run:
        description: Successful renderer workflow run to copy
        required: false
        type: string

permissions:
  contents: read

jobs:
  stage-renderer-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage-renderer-artifact }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: check out signed feed tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: launcher

      - name: copy exact renderer artifact to draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RENDERER_RUN_ID: ${{ inputs.renderer-artifact-run }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RENDERER_RUN_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Renderer run ID is invalid.' }
          $feed = ./launcher/verify-renderer-update-feed.ps1 | ConvertFrom-Json
          $runText = gh run view $env:RENDERER_RUN_ID --repo brockliddicoat/uvsr --json status,conclusion,headSha
          if ($LASTEXITCODE -ne 0) { throw 'Renderer run is unavailable.' }
          $run = $runText | ConvertFrom-Json
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.headSha -cne $feed.sourceCommit) {
            throw 'Renderer run does not prove the signed source identity.'
          }
          $tag = "uvsr-engine-r$($feed.releaseSequence)"
          $releaseText = gh release view $tag --repo brockliddicoat/uvsr --json isDraft,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw 'Renderer draft release is unavailable.' }
          $release = $releaseText | ConvertFrom-Json
          if (-not $release.isDraft -or $release.targetCommitish -cne $feed.sourceCommit) {
            throw 'Renderer release must be a draft for the signed source commit.'
          }
          $existing = @($release.assets | Where-Object name -CEQ $feed.artifact.name)
          if ($existing.Count) {
            if ($existing.Count -ne 1 -or $existing[0].size -ne $feed.artifact.size -or $existing[0].digest -cne "sha256:$($feed.artifact.sha256)") {
              throw 'A different renderer asset already exists.'
            }
            Write-Output 'The exact renderer artifact is already staged.'
            exit 0
          }
          $source = Join-Path $env:RUNNER_TEMP 'renderer-release-source'
          gh run download $env:RENDERER_RUN_ID --repo brockliddicoat/uvsr --name "uvsr-runtime-bundle-$($feed.sourceCommit)" --dir $source
          if ($LASTEXITCODE -ne 0) { throw 'Renderer artifact download failed.' }
          $archive = Join-Path $source $feed.artifact.name
          if ((Get-Item -LiteralPath $archive).Length -ne $feed.artifact.size -or
              (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $feed.artifact.sha256) {
            throw 'Renderer archive differs from its signed identity.'
          }
          gh release upload $tag $archive --repo brockliddicoat/uvsr
          if ($LASTEXITCODE -ne 0) { throw 'Renderer draft upload failed.' }
          Write-Output "Staged $($feed.artifact.name), SHA-256 $($feed.artifact.sha256)."

  verify-release-artifacts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify-release-artifacts && !inputs.stage-renderer-artifact }}
    runs-on: windows-2025
    timeout-minutes: 30
    # GitHub requires write access even to read unpublished release assets.
    permissions:
      contents: write
    steps:
      - name: check out release proof sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive

      - name: verify feed signatures and draft access
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $launcher = ./launcher/verify-launcher-update-feed.ps1 | ConvertFrom-Json
          $renderer = ./launcher/verify-renderer-update-feed.ps1 | ConvertFrom-Json
          foreach ($tag in @("uvsr-launcher-v$($launcher.version)", "uvsr-engine-r$($renderer.releaseSequence)")) {
            gh release view $tag --repo brockliddicoat/uvsr --json tagName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Release is unavailable: $tag" }
          }

      - name: build native proof helper
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "uvsr-launcher-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./launcher/build.ps1 -OutputDirectory $output -SourceCommit $env:GITHUB_SHA
          "UVSR_LAUNCHER_OUTPUT=$output" >> $env:GITHUB_ENV

      - name: verify exact release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./launcher/verify-release-artifacts.ps1 -LauncherTests "$env:UVSR_LAUNCHER_OUTPUT/build/Release/uvsr_launcher_tests.exe" -OutputDirectory "$env:RUNNER_TEMP/uvsr-release-proof"

  build:
    if: ${{ !inputs.stage-renderer-artifact && !inputs.verify-release-artifacts }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check Out Exact Sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify Historical V1 Feed
        shell: pwsh
        run: |
          function Get-RepositoryTextHash([string] $path) {
            $utf8 = [Text.UTF8Encoding]::new($false, $true)
            $text = $utf8.GetString([IO.File]::ReadAllBytes($path))
            $normalized = $text.Replace("`r`n", "`n")
            if ($normalized.Contains("`r")) {
              throw "Historical launcher v1 alias has invalid line endings."
            }
            return [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData(
                $utf8.GetBytes($normalized))).ToLowerInvariant()
          }
          $launcherHash = Get-RepositoryTextHash(
            "$env:GITHUB_WORKSPACE/launcher/launcher-feed-v1.json")
          if ($launcherHash -ne
              "5689fc9d8856c503e5ff48d091825ff59290065986bb915299dfbcc0b96bcd7d") {
            throw "Historical launcher v1 alias bytes changed."
          }

      - name: Verify Signed Update Feeds
        shell: pwsh
        run: |
          ./launcher/verify-launcher-update-feed.ps1 | Out-Null
          ./launcher/verify-renderer-update-feed.ps1 | Out-Null

      - name: Build And Verify Launcher
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "uvsr-launcher-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./launcher/build.ps1 -OutputDirectory $output -SourceCommit $env:GITHUB_SHA
          "UVSR_LAUNCHER_OUTPUT=$output" >> $env:GITHUB_ENV

      - name: Enforce Public Signing Gate
        shell: pwsh
        env:
          REQUIRE_PUBLICATION_SIGNATURE: ${{ inputs.require-publication-signature || false }}
        run: |
          $launcher = Join-Path $env:UVSR_LAUNCHER_OUTPUT "uvsr-launcher.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $launcher
          if ([string]$signature.Status -notin @("Valid", "NotSigned")) {
            throw "Launcher Authenticode status is invalid: $($signature.Status)"
          }
          if ($env:REQUIRE_PUBLICATION_SIGNATURE -eq "true" -and
              [string]$signature.Status -ne "Valid") {
            throw "Public launcher publication is blocked until an authorized certificate produces a valid Authenticode signature."
          }
          if ([string]$signature.Status -eq "NotSigned") {
            Write-Output "The launcher has no Authenticode signature. No release is published by this workflow."
          }

      - name: retain verified launcher
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export-launcher-artifact }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uvsr-launcher-${{ github.sha }}
          path: |
            ${{ env.UVSR_LAUNCHER_OUTPUT }}/uvsr-launcher.exe
            ${{ env.UVSR_LAUNCHER_OUTPUT }}/uvsr-launcher.exe.sha256
            ${{ env.UVSR_LAUNCHER_OUTPUT }}/build-record.json
          if-no-files-found: error
          retention-days: 1

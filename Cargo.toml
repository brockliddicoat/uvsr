[workspace]
members = ["crates/agfx", "crates/shader-to-human"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
ash = "=0.38.0"
serde_json = "1.0"
sha2 = "0.10"
